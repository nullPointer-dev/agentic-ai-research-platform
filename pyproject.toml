[project]
name = "agentic-ai-research-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.13",
    "openai>=3.24.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call external services",
]
